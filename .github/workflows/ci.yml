name: Flutter CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Validate migration and secret boundaries
        shell: bash
        run: |
          test -s supabase/migrations/202608230001_mvp.sql
          test -s supabase/functions/purge_deleted_data/index.ts
          ! rg -n "SUPABASE_SERVICE_ROLE_KEY|service_role" lib android ios

      - uses: actions/upload-artifact@v4
        with:
          name: where-is-that-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
